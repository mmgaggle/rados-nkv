# nkvx executor service — durable RLIMIT_MEMLOCK grant
# ---------------------------------------------------------------------------
# WHY:
#   The nkvx executor (and the front client) bring up Mercury na_ofi over the
#   verbs provider (ofi+verbs;ofi_rxm://) on the E810 / irdma RoCEv2 fabric.
#   At fi_enable() the verbs provider creates the CQ/QP and maps the doorbell,
#   and irdma pins REGULAR (non-hugepage) process memory for those resources via
#   ibv_reg_mr. Under the default unprivileged RLIMIT_MEMLOCK cap (8 MB on this
#   host) that pinning fails and Mercury's CQ creation returns -12 (ENOMEM),
#   so HG_Init() over verbs fails. (A/B proven in bead spdk-xmu.8:
#     user, 8 MB    -> FAIL at CQ creation (-12)
#     root, 8 MB    -> SUCCESS
#     root, unlimited -> SUCCESS )
#
#   This is NOT the SPDK/DPDK data plane: SPDK serves its RDMA buffers from
#   pre-reserved hugepages, which are not charged against RLIMIT_MEMLOCK the way
#   irdma CQ/QP/doorbell pinning is. So the live nvmf_tgt runs fine at 8 MB while
#   the na_ofi/verbs Exec hop does not. The fix is configuration only — no code
#   change and no libfabric rebuild.
#
# WHAT:
#   Grant the executor service user unlimited locked memory. Replace the
#   placeholder user "nkvx" below with the actual service account that runs
#   nkvx_service (e.g. "kyle" for an interactive on-rig run).
#
# INSTALL (run as root; takes effect on the user's NEXT login / new session —
# already-running shells and the live rig are unaffected):
#   sudo install -m 0644 99-nkvx-memlock.conf /etc/security/limits.d/99-nkvx-memlock.conf
#   # then open a fresh login shell for that user and confirm:
#   #   ulimit -l        # expect: unlimited
#
# NOTE: limits.d is applied by pam_limits at login (ssh / login / su -). It does
# NOT apply to processes started by systemd — for the systemd-managed executor
# use the LimitMEMLOCK drop-in (nkvx-executor.service.d/10-memlock.conf) instead.

# <domain>  <type>  <item>     <value>
nkvx        soft    memlock    unlimited
nkvx        hard    memlock    unlimited
