# Sample rkv client config for the compose stack.
# Mounted into the rkv container at /root/.rados-nkv.conf (see compose.yaml).
# Full schema: clients/rkv/README.md.

[target]
# vfio-user endpoint directory the front (nkv) creates; libvfio-user listens on
# a `cntrl` socket here. Must match the front's VFU_DIR (default below). The rkv
# client and the nkv front share this path via the `muser` volume.
traddr = /var/run/muser/domain/kv

# Persistent-session daemon socket (rkv daemon start). Default $HOME/.rados-nkv.sock.
#daemon_sock = /root/.rados-nkv.sock

[namespaces]
# Friendly name -> NVMe nsid. The compose front exposes its single KV namespace
# as nsid 1 (both the mem and rados backends add it as the first namespace).
kv = 1
