[package]
name = "rados-nkv"
version = "0.1.0"
edition = "2021"
description = "Ergonomic Rust CLI for the NVMe-KV (rados-nkvx) datapath over vfio-user"
license = "BSD-3-Clause"

[[bin]]
name = "rados-nkv"
path = "src/main.rs"

[features]
# OFF by default: keeps the build ROCm-free and routes `--gpu` through the
# nkv_vfu_gpu subprocess (bead spdk-jhk.7.7). When ON, build.rs compiles+links
# the native HIP GPU-initiated datapath (csrc/nkvx_gpu.hip) and `--gpu` runs it
# in-process (bead spdk-jhk.7.15). Requires hipcc + libamdhip64 at build time.
gpu-native = []

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[build-dependencies]
cc = "1"
