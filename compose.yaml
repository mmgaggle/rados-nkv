# rados-nkv — podman compose for the OUT-OF-TREE datapath (Slice I).
#
# Topology change vs the old in-tree layout: bdev_kvrados is now a pure FORWARDER
# (the in-tree kvdev_mem/kvdev_rados backends are GONE), so the front (nkv) ALWAYS
# forwards KV verbs over Mercury to a rados-nkvx executor (nkvx). The executor is
# therefore a CORE service here, not a two-tier-only add-on.
#
# Self-contained, no Ceph (default; executor runs its writable in-memory backend):
#   sudo podman-compose up -d
#   sudo podman-compose exec rkv rkv store kv/hello      # value from stdin
#   sudo podman-compose exec rkv rkv get   kv/hello
#   sudo podman-compose down
#
# Real Ceph (executor cold-fills + persists to a RADOS pool):
#   - set NKVX_BACKEND=rados, point CEPH_DIR at a ceph.conf+keyring dir, set POOL
#   - sudo podman-compose --profile rados up -d         (uses the `nkvx-rados` executor)
#
# Notes:
#   * vfio-user is host-local: the services share the `muser` volume and the host
#     network. The rkv client attaches to the front's `cntrl` socket there.
#   * The front reaches the executor over Mercury at REMOTE_EXECUTOR
#     (ofi+tcp://127.0.0.1:1234 by default — deterministic, so the front uses it
#     verbatim; both services run on the host network). For RDMA use
#     ofi+verbs://… , run rootful, and add --device /dev/infiniband to both.
#   * Run rootful (`sudo podman-compose`): SPDK needs hugepages + memlock and the
#     vfio-user privileges.
#   * The rkv container idles so you can run a SERIES of commands via
#     `podman-compose exec rkv rkv …`.

name: rados-nkv

x-executor-listen: &executor_listen ${NKVX_LISTEN:-ofi+tcp://127.0.0.1:1234}

services:
  # ---- Executor: rados-nkvx Mercury Exec target. The forwarder ALWAYS needs it.
  #      Default flavor: writable in-memory backend (no Ceph). ------------------
  nkvx:
    image: quay.io/mmgaggle/rados-nkv:devel
    network_mode: host
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
    volumes:
      - nkvx-run:/var/run/rados-nkvx
    environment:
      NKV_ROLE: nkvx
      NKVX_LISTEN: *executor_listen
      NKVX_ADDR_FILE: /var/run/rados-nkvx/addr
      # Writable in-memory backend (one seed flips the switch; not a real key).
      NKVX_MEM_OBJECT: ${NKVX_MEM_OBJECT:-__seed__=x}

  # ---- Executor (Ceph flavor): same image, RADOS backend instead of mem. ------
  nkvx-rados:
    image: quay.io/mmgaggle/rados-nkv:devel
    profiles: [rados]
    network_mode: host
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
    volumes:
      - nkvx-run:/var/run/rados-nkvx
      - ${CEPH_DIR:-/etc/ceph}:${CEPH_DIR:-/etc/ceph}:ro
    environment:
      NKV_ROLE: nkvx
      NKVX_LISTEN: *executor_listen
      NKVX_ADDR_FILE: /var/run/rados-nkvx/addr
      NKVX_RADOS_POOL: ${POOL:-kvpool}
      NKVX_RADOS_NAMESPACE: ${CEPH_NS:-kvns}
      NKVX_RADOS_CONF: ${CEPH_DIR:-/etc/ceph}/ceph.conf
      NKVX_RADOS_USER: ${CEPH_USER:-admin}

  # ---- Front / target: NVMe-KV over vfio-user, forwards to the executor. ------
  nkv:
    image: quay.io/mmgaggle/rados-nkv:devel
    network_mode: host
    privileged: true
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
    depends_on:
      - nkvx
    volumes:
      - muser:/var/run/muser
      - nkvx-run:/var/run/rados-nkvx:ro
      - /dev/hugepages:/dev/hugepages
      # Ceph config (rados flavor only); unused by the mem default.
      - ${CEPH_DIR:-/etc/ceph}:${CEPH_DIR:-/etc/ceph}:ro
    environment:
      NKV_ROLE: nkv
      BACKEND: ${NKV_BACKEND:-mem}
      POOL: ${POOL:-kvpool}
      CEPH_NS: ${CEPH_NS:-kvns}
      # The forwarder reaches the executor here. ofi+tcp is deterministic, so the
      # front uses REMOTE_EXECUTOR verbatim; for na+sm set EXECUTOR_ADDR_FILE to
      # the shared addr-file instead (mounted read-only above).
      REMOTE_EXECUTOR: ${REMOTE_EXECUTOR:-ofi+tcp://127.0.0.1:1234}
      EXECUTOR_ADDR_FILE: ${EXECUTOR_ADDR_FILE:-/var/run/rados-nkvx/addr}
      # mem dev default avoids hugepages; for a hugepage run drop --no-huge.
      NVMF_TGT_ARGS: ${NVMF_TGT_ARGS:---no-huge -s 1024 -m 0x2}

  # ---- rkv client: idles so you can exec a series of commands into it ---------
  rkv:
    image: quay.io/mmgaggle/rados-nkv-client:devel
    network_mode: host
    privileged: true
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
    depends_on:
      - nkv
    volumes:
      - muser:/var/run/muser
      - /dev/hugepages:/dev/hugepages
      - ./packaging/container/rados-nkv.conf:/root/.rados-nkv.conf:ro,z
    environment:
      # 1 => start the warm persistent-session daemon at container start (the
      # front must be up). 0 => plain idle; each exec'd `rkv` is one-shot.
      RKV_DAEMON: ${RKV_DAEMON:-0}

volumes:
  muser:
  nkvx-run:
